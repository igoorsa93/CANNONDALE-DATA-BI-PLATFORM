version: '3.8'

services:
  # Main PostgreSQL database for products, sales, inventory, stores
  postgres:
    image: postgres:16-alpine
    container_name: cannondale-pg
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cannondale
      POSTGRES_USER: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema:/docker-entrypoint-initdb.d/schema
      - ./database/seeds:/docker-entrypoint-initdb.d/seeds
      - ./database/views:/docker-entrypoint-initdb.d/views
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL for image metadata
  postgres_images:
    image: postgres:16-alpine
    container_name: cannondale-pg-images
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cannondale_images
      POSTGRES_USER: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_images_data:/var/lib/postgresql/data
      - ./database-images/schema:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  postgres_images_data: